<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" fill="none">
  <!-- Minimalist Horizon Ridge (2 calm sweeping lines) -->
  <g stroke="#FCF6EC" stroke-linecap="round" stroke-linejoin="round">
    <path opacity="0.06" stroke-width="1.2" d="M620 640 C 780 560, 960 470, 1180 445 C 1290 432, 1375 440, 1460 460" />
    <path opacity="0.04" stroke-width="1" d="M820 640 C 970 575, 1130 515, 1310 500 C 1375 495, 1420 502, 1460 512" />

    <!-- Tree 1 (Main Tall Forest Pine on Right Ridge - x:1190, base y:444) -->
    <g opacity="0.085" stroke-width="1.3">
      <!-- Trunk -->
      <line x1="1190" y1="210" x2="1190" y2="444" />
      <!-- Minimalist Layered Canopy Tiers -->
      <path d="M1190 202 L1156 258 L1224 258 Z" />
      <path d="M1190 242 L1144 312 L1236 312 Z" />
      <path d="M1190 288 L1132 370 L1248 370 Z" />
      <path d="M1190 338 L1122 422 L1258 422 Z" />
