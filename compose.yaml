services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    container_name: technoversary-web
    ports:
      - "4321:4321"
    volumes:
      - .:/app:Z
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
    restart: unless-stopped
