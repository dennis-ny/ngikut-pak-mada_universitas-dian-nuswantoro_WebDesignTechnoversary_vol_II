[project]
name = "ashen-news"
version = "0.1.0"
description = "Agregator berita lingkungan Indonesia untuk halaman /belajar ASHEN (RSS + Google News -> klasifikasi -> dedupe -> SQLite)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "pyyaml>=6.0",
  "rapidfuzz>=3.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ashen-news = "ashen_news.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashen_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
