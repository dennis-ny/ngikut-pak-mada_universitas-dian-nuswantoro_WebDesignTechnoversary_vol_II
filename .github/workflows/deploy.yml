name: deploy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Pull and rebuild production container in apps directory
        run: |
          cd "$HOME/apps/ngikut-pak-mada_universitas-dian-nuswantoro_WebDesignTechnoversary_vol_II"
          git pull --ff-only origin main
          docker compose -f compose.prod.yaml up -d --build --remove-orphans
